<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titik Arab — Media Interaktif Bahasa Arab</title>
    <meta name="description"
        content="Media interaktif belajar bahasa Arab: roda putar dan kartu hijaiyah HarakaPlay. Gratis, bisa dibuka dari HP.">
    <meta property="og:title" content="Titik Arab — Media Interaktif Bahasa Arab">
    <meta property="og:description"
        content="Belajar Arab sambil main: roda putar, kartu hijaiyah, dan lainnya. Gratis!">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/home.css">
</head>

<body>
    <!-- Latar beranda: langit + awan -->
    <div class="page-bg" aria-hidden="true">
        <span class="cloud cloud--1"></span>
        <span class="cloud cloud--2"></span>
        <span class="cloud cloud--3"></span>
    </div>

    <main class="home">

        <!-- ===== Kepala ===== -->
        <header class="home-head">
            <h1>
                <span class="home-ar">وَسَائِلُ تَفَاعُلِيَّة</span>
                <span class="home-brand">Titik Arab</span>
                <span class="home-title">Media Interaktif Bahasa Arab</span>
            </h1>
            <p class="home-lead">Belajar Arab sambil main. Pilih media di bawah, langsung gas!</p>
            <a class="home-skip" href="#media">Lihat media ↓</a>
        </header>

        <!-- ===== Daftar media (dibuat otomatis dari media-list.js) ===== -->
        <section id="media" class="block" aria-labelledby="mediaTitle">
            <h2 class="block-title" id="mediaTitle">Pilih Media</h2>
            <div class="grid" id="mediaGrid"></div>
        </section>

        <!-- ===== Tentang ===== -->
        <section class="block panel about" aria-labelledby="aboutTitle">
            <h2 class="block-title" id="aboutTitle"></h2>
            <div class="about__text" id="aboutText"></div>
            <div class="social-row" id="socialRow"></div>
        </section>

        <!-- ===== Statistik kunjungan ===== -->
        <section class="block panel stats" id="stats" aria-labelledby="statsTitle">
            <h2 class="block-title" id="statsTitle">Pengunjung Titik Arab 🌍</h2>
            <div id="statsBody">
                <p class="stats__none">Memuat…</p>
            </div>
        </section>

        <!-- ===== Dukungan sukarela ===== -->
        <section class="block panel support" aria-labelledby="supportTitle">
            <h2 class="block-title" id="supportTitle"></h2>
            <p class="support__text" id="supportText"></p>
            <div class="support__actions" id="supportActions"></div>
        </section>

        <!-- ===== Kaki halaman ===== -->
        <footer class="foot">
            <div class="social-row social-row--icons" id="footSocial"></div>
            <p>© <span id="year"></span> Titik Arab · dibuat dengan ❤️ untuk para pembelajar bahasa Arab</p>
        </footer>
    </main>

    <script src="media-list.js"></script>
    <script src="site-config.js"></script>
    <script src="assets/js/home.js"></script>
</body>

</html>
